<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Member Spotlight | Truth at Work</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index.html" data-step="-1">
<header class="banner">
  <img src="images/banner.jpg" alt="Truth at Work Round Table - Featured Member Presentation" width="1427" height="210">
</header>
<div class="wrap">
<main class="gate" id="main">
  <p class="kicker">Truth at Work &middot; Round Table</p>
  <h1>Member Spotlight</h1>
  <p class="lead">You've come to the right place to complete your Featured Member Presentation. Please enter the access code you were given to begin.</p>
  <form id="gate" novalidate>
    <div class="q">
      <label for="code">Access code</label>
      <input type="password" id="code" name="code" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false" required>
    </div>
    <p id="gmsg" class="gmsg" role="alert" aria-live="assertive"></p>
    <button class="btn primary" id="gbtn" type="submit">Continue &rarr;</button>
  </form>
  <p class="fine">Don't have the code? Please contact Gill.</p>
</main>
<footer class="foot">Truth at Work &middot; Round Table &middot; Member Spotlight</footer>
</div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
